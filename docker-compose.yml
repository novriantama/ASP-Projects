services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: asp_projects_db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asp_projects_api
    restart: unless-stopped
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: ${APP_PORT:-5050}
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_NAME: ${DB_NAME:-ProjectsDb}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-ASPProjectsApi}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ASPProjectsClient}
      JWT_EXPIRES_IN_HOURS: ${JWT_EXPIRES_IN_HOURS:-24}
    ports:
      - "${APP_PORT:-5050}:${APP_PORT:-5050}"
    depends_on:
      - sqlserver

volumes:
  sqlserver_data:
