services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: asp_projects_db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asp_projects_api
    restart: unless-stopped
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: ${APP_PORT:-5000}
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_NAME: ${DB_NAME:-ASPProjectsDb}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${APP_PORT:-5000}:${APP_PORT:-5000}"
    depends_on:
      - sqlserver

volumes:
  sqlserver_data:
